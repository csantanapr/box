name: CI

on:
  # Nightly, so runner-image drift is caught on its own. The suites drive the
  # built binary against the OS's own enforcement, which can change with no
  # commit here. Off-the-hour: scheduled runs are delayed most at :00.
  schedule:
    - cron: "17 11 * * *"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed by event too, so a nightly never cancels a merge's validation run:
  # both would otherwise land in the same `refs/heads/main` group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      containment: ${{ steps.filter.outputs.containment }}
      verdict: ${{ steps.filter.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # `**/!(*.md)` excludes docs-only changes from the matrix; keep it an
          # extglob, not a `!**/*.md` negation (paths-filter OR-s patterns, so a
          # bare negation fires on everything).
          filters: |
            rust:
              - 'crates/**/!(*.md)'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust-*'
              - '.github/workflows/ci.yml'
            containment:
              - 'crates/**/!(*.md)'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'test-integ/**/!(*.md)'
              # test-integ re-exports the shared decision-journal reader, so a
              # change there changes what every containment case parses.
              - 'test-common/**/!(*.md)'
              - '.github/workflows/containment-deterministic.yml'
              - '.github/workflows/ci.yml'
            verdict:
              - 'test-common/**/!(*.md)'
              - 'test-workload/verdict/**/!(*.md)'
              - '.github/workflows/verdict-hermetic.yml'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust
    needs: detect-changes
    # On push and workflow_dispatch, detect-changes still runs but its filter
    # outputs are unset — run rust unconditionally in those cases.
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/rust-test-lint.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  containment:
    name: Containment
    needs: detect-changes
    # Same unconditional-on-push rule as `rust`: detect-changes runs but its
    # filter outputs are unset outside a pull_request.
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.containment == 'true' }}
    uses: ./.github/workflows/containment-deterministic.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  verdict:
    name: Verdict
    needs: detect-changes
    # Same unconditional-on-push rule as the legs above.
    if: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.verdict == 'true' }}
    uses: ./.github/workflows/verdict-hermetic.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [detect-changes, rust, containment, verdict]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: rust, containment, verdict
          jobs: ${{ toJSON(needs) }}

  nightly-failure-issue:
    name: Nightly failure issue
    # The nightly only: a red PR or push already reports on the PR or the commit,
    # so an issue per red PR would be pure noise.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [detect-changes, rust, containment, verdict]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File an issue naming every failed leg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Read step conclusions, not `needs`: the Linux containment leg and the
          # macOS unit-test leg are continue-on-error, so a break there can report
          # success at the job level and would otherwise go unreported.
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[]
                  | select(.name != "Nightly failure issue")
                  | select(.conclusion == "failure" or any(.steps[]?; .conclusion == "failure"))
                  | "- `\(.name)`"' | sort -u)

          if [ -z "$failed" ]; then
            echo "Every leg passed; nothing to file."
            exit 0
          fi

          body=$(mktemp)
          {
            echo "The nightly containment run failed. This is filed automatically by \`ci.yml\`."
            echo
            echo "**Failed:**"
            echo "$failed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| run | $run_url |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| started | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo
            echo "The suites drive the built binary against the OS's own enforcement, so a"
            echo "nightly-only failure with no commit of ours usually means the runner image"
            echo "moved. Reproduce with \`workflow_dispatch\` on \`ci.yml\` before assuming a"
            echo "product regression."
            echo
            echo "cc @strands-agents/strands-box-maintainers"
          } > "$body"

          gh issue create \
            --title "Nightly containment suite failed — $(date -u +%Y-%m-%d) (run $GITHUB_RUN_ID)" \
            --body-file "$body" \
            --label bug
